name: Build ARM64 Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure ARM64 only
        run: |
          sed -i 's/include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")/include("arm64-v8a")/' app/build.gradle.kts
          sed -i 's/isUniversalApk = true/isUniversalApk = false/' app/build.gradle.kts

      - name: Build ARM64 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleGoogleDebug

      - name: Show APK location
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dantotsu-arm64-debug
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
